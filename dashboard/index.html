<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<meta property="og:title" content="Zangetsu Dashboard" />
		<meta property="og:image" content="https://cdn.discordapp.com/icons/1514592000429654196/c07572fcdd3987826f09fdcd490e9b65.webp?size=512" />
		<!-- Matches --color-background in each theme, so a phone's browser chrome is never a different colour to the page. -->
		<meta name="theme-color" content="#f4f4f9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#07070b" media="(prefers-color-scheme: dark)" />

		<!-- Self-hosted, so no preconnect is needed — but the CSS has to parse before these are discovered otherwise. -->
		<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
		<!-- Unhashed and at the root, where home-screen tools that ignore these links look for them anyway. -->
		<link rel="icon" type="image/webp" href="https://cdn.discordapp.com/icons/1514592000429654196/c07572fcdd3987826f09fdcd490e9b65.webp?size=512" />
		<link rel="apple-touch-icon" href="https://cdn.discordapp.com/icons/1514592000429654196/c07572fcdd3987826f09fdcd490e9b65.webp?size=512" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<title>Zangetsu Dashboard</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
